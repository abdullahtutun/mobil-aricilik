<!DOCTYPE html>
<html lang="{{ .Lang }}" dir="{{ .Dir }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
    <title>{{ .T.Subject }}</title>
  </head>
  <body style="margin:0; padding:0; background-color:#FFF8EE;">
    <div style="display:none; max-height:0; overflow:hidden; opacity:0;">
      {{ .T.Preheader }}
    </div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#FFF8EE;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px; background-color:#FFFFFF; border:1px solid #E2D4BF; border-radius:12px;">
            <tr>
              <td style="padding:32px 24px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color:#1F1A14;">
                <p style="margin:0 0 24px; font-size:16px; font-weight:700; color:#995A00;">Mobil Arıcı</p>
                <h1 style="margin:0 0 12px; font-size:22px; line-height:28px; font-weight:700;">
                  {{ .T.Heading }}
                </h1>
                <p style="margin:0 0 24px; font-size:16px; line-height:24px;">
                  {{ .T.Instruction }}
                </p>
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td align="center" style="padding:20px 8px; background-color:#F6EBDA; border-radius:8px;">
                      <span dir="ltr" style="font-family:'SF Mono', Menlo, Consolas, 'Roboto Mono', 'Courier New', monospace; font-size:40px; line-height:48px; font-weight:700; letter-spacing:8px; color:#1F1A14; white-space:nowrap;">{{ .Code }}</span>
                    </td>
                  </tr>
                </table>
                <p style="margin:24px 0 8px; font-size:16px; line-height:24px;">
                  {{ .Validity }}
                </p>
                <p style="margin:0; font-size:14px; line-height:20px; color:#5E554A;">
                  {{ .T.Ignore }}
                </p>
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0; max-width:480px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:12px; line-height:18px; color:#5E554A;">
            {{ .SentTo }}
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
