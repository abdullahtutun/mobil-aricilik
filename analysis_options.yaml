include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/core/l10n/generated/**

linter:
  rules:
    # Uygulama kodu; paket API dokümantasyonu zorunlu değil.
    public_member_api_docs: false
